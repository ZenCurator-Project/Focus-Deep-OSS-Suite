<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Clock | Focus-Deep</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Noto+Serif+JP:wght@200&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F1ECE4;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            font-family: 'Noto Serif JP', serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 500px;
            height: 500px;
        }

        /* 墨の画像：ここ自体を削り取る設定（マスク不要） */
        #ensoImage {
            position: absolute;
            width: 80%;
            height: 80%;
            background-image: url('enso-ink.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 1;
            mix-blend-mode: multiply;
            opacity: 0.9;
            /* 扇形に表示範囲を制限する設定 */
            clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, 50% 0%);
        }

        .content-layer {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .status-text {
            font-size: 0.9rem;
            letter-spacing: 0.6rem;
            color: #666;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .timer-display {
            font-family: 'Roboto Mono', monospace;
            font-size: 8rem;
            font-weight: 300;
            letter-spacing: -5px;
            margin: 0;
            color: #1a1a1a;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .controls button {
            background: rgba(255,255,255,0.4);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 0.6rem 2rem;
            cursor: pointer;
            font-family: 'Noto Serif JP', serif;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="ensoImage"></div>

    <div class="content-layer">
        <div id="status" class="status-text">Single-tasking</div>
        <div id="display" class="timer-display">25:00</div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>
</div>

<script>
    let initialTime = 25 * 60;
    let timeLeft = initialTime;
    let timerId = null;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const ensoImage = document.getElementById('ensoImage');

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        // 残り時間に合わせて、画像を表示する「扇形の角度」を直接計算する
        const progress = timeLeft / initialTime;
        const deg = progress * 360;
        
        // 複雑な計算を避け、確実な円形カットを適用
        // 角度（deg）に応じて画像を円形に切り取る
        if (progress > 0) {
            ensoImage.style.display = 'block';
            // conic-gradientをマスクとして使い、画像そのものを削る
            ensoImage.style.webkitMaskImage = `conic-gradient(black ${deg}deg, transparent ${deg}deg)`;
            ensoImage.style.maskImage = `conic-gradient(black ${deg}deg, transparent ${deg}deg)`;
            ensoImage.style.transform = 'rotate(-0.1deg)'; // 描画バグ防止
        } else {
            ensoImage.style.display = 'none';
        }
    }

    startBtn.addEventListener('click', () => {
        if (timerId === null) {
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                }
            }, 1000);
            startBtn.textContent = 'Pause';
        } else {
            clearInterval(timerId);
            timerId = null;
            startBtn.textContent = 'Resume';
        }
    });

    resetBtn.addEventListener('click', () => {
        clearInterval(timerId);
        timerId = null;
        timeLeft = initialTime;
        updateDisplay();
        startBtn.textContent = 'Start';
    });

    updateDisplay();
</script>
</body>
</html>
