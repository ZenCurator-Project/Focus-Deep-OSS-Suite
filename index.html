<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Clock | Focus-Deep</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Noto+Serif+JP:wght@200&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F1ECE4;
            --washi-pattern: url('https://www.transparenttextures.com/patterns/cream-paper.png');
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            background-image: var(--washi-pattern);
            font-family: 'Noto Serif JP', serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 500px;
            height: 500px;
        }

        /* 1. 墨の画像レイヤー */
        .enso-ink-image {
            position: absolute;
            width: 80%;
            height: 80%;
            background-image: url('enso-ink.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 1;
            mix-blend-mode: multiply;
            opacity: 0.9;
        }

        /* 2. 蓋（マスク）レイヤー：境界線を消すために疑似要素を活用 */
        .enso-mask-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            transform: rotate(-90deg);
        }

        .enso-mask {
            position: absolute;
            width: 100%;
            height: 100%;
            /* 扇形のグラデーション。背景色と完全に一致させる */
            background: conic-gradient(transparent 0deg, var(--bg-color) 0deg);
        }

        /* マスクに和紙模様を重ねて「四角い違和感」を消す */
        .enso-mask-container::after {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background-image: var(--washi-pattern);
            opacity: 0.4;
            pointer-events: none;
        }

        /* 3. タイマー表示レイヤー */
        .content-layer {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .status-text {
            font-size: 0.9rem;
            letter-spacing: 0.6rem;
            color: #666;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .timer-display {
            font-family: 'Roboto Mono', monospace;
            font-size: 8rem;
            font-weight: 300;
            letter-spacing: -5px;
            margin: 0;
            color: #1a1a1a;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .controls button {
            background: rgba(255,255,255,0.4);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 0.6rem 2rem;
            cursor: pointer;
            font-family: 'Noto Serif JP', serif;
            letter-spacing: 0.1rem;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="enso-ink-image"></div>
    <div class="enso-mask-container">
        <div class="enso-mask" id="ensoMask"></div>
    </div>

    <div class="content-layer">
        <div id="status" class="status-text">Single-tasking</div>
        <div id="display" class="timer-display">25:00</div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>
</div>

<script>
    let initialTime = 25 * 60;
    let timeLeft = initialTime;
    let timerId = null;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const ensoMask = document.getElementById('ensoMask');

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        // 残り時間に合わせて和紙色の蓋を回転させる
        const progress = 1 - (timeLeft / initialTime);
        const degrees = progress * 360;
        
        // 蓋の色を背景色（#F1ECE4）に固定し、角度だけを変える
        ensoMask.style.background = `conic-gradient(transparent 0deg, #F1ECE4 ${degrees}deg)`;
        
        document.title = `${display.textContent} | Zen-Clock`;
    }

    startBtn.addEventListener('click', () => {
        if (timerId === null) {
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                }
            }, 1000);
            startBtn.textContent = 'Pause';
        } else {
            clearInterval(timerId);
            timerId = null;
            startBtn.textContent = 'Resume';
        }
    });

    resetBtn.addEventListener('click', () => {
        clearInterval(timerId);
        timerId = null;
        timeLeft = initialTime;
        updateDisplay();
        startBtn.textContent = 'Start';
    });

    updateDisplay();
</script>
</body>
</html>
