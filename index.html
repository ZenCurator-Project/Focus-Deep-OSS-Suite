<style>
    :root {
        --bg-color: #F9F9F7;
        --text-color: #2C2C2C;
        --accent-color: #888;
        --enso-color: rgba(44, 44, 44, 0.05); /* 非常に薄い墨色 */
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        /* 背景に微かな和紙のようなテクスチャを追加（擬似的） */
        background-color: var(--bg-color);
        background-image: radial-gradient(#e1e1e1 0.5px, transparent 0.5px);
        background-size: 20px 20px;
        color: var(--text-color);
        font-family: 'Noto Serif JP', serif;
        transition: background-color 3s ease;
        overflow: hidden;
    }

    /* 呼吸する背景：色ではなく、中央の光の強弱で表現 */
    body.active {
        animation: breath-glow 10s infinite ease-in-out;
    }

    @keyframes breath-glow {
        0%, 100% { background-color: #F9F9F7; }
        50% { background-color: #F0F0EB; }
    }

    .container {
        position: relative;
        text-align: center;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 400px;
        height: 400px;
    }

    /* 円相 (Enso) を模した進行状況サークル */
    .enso-ring {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 2px solid var(--enso-color);
        border-radius: 50%;
        mask-image: linear-gradient(0deg, black 50%, transparent 100%); /* 一筆書き感を出す */
        transition: transform 1s linear;
    }

    .status-text {
        font-size: 0.75rem;
        letter-spacing: 0.5rem;
        color: var(--accent-color);
        text-transform: uppercase;
        margin-top: -2rem;
    }

    .timer-display {
        font-family: 'Extra Light 200', sans-serif;
        font-size: 6rem;
        font-weight: 100;
        margin: 1rem 0;
        font-variant-numeric: tabular-nums;
    }

    .controls button {
        background: none;
        border: none;
        color: var(--text-color);
        font-size: 0.7rem;
        cursor: pointer;
        letter-spacing: 0.2rem;
        text-transform: uppercase;
        opacity: 0.3;
        transition: 0.5s;
    }

    .controls button:hover { opacity: 1; }
</style>

<body id="body">
<div class="container">
    <div class="enso-ring" id="enso"></div> <div class="status-text" id="status">Single-tasking</div>
    <div id="display" class="timer-display">25:00</div>
    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="resetBtn">Reset</button>
    </div>
</div>
</script>

</body>
</html>
