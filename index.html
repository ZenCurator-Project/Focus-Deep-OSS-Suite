<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Clock | Deep Focus Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F1ECE4;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            background-size: 512px 512px;
            background-attachment: fixed;
            font-family: 'Noto Serif JP', serif;
            overflow: hidden;
        }

        .main-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 墨の円エリア */
        .enso-circle {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 100px;
        }

        /* 墨の背景画像 */
        .enso-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('enso-ink.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            mix-blend-mode: multiply;
            -webkit-mask-image: radial-gradient(circle, transparent 0%, transparent 48%, black 50%, black 100%);
            mask-image: radial-gradient(circle, transparent 0%, transparent 48%, black 50%, black 100%);
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* フェードレイヤー */
        .enso-fade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-mask-image: radial-gradient(circle, transparent 0%, transparent 48%, black 50%, black 100%);
            mask-image: radial-gradient(circle, transparent 0%, transparent 48%, black 50%, black 100%);
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            pointer-events: none;
        }

        /* テキストレイヤー */
        .text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .label {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(0, 0, 0, 0.25);
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .timer-display {
            font-family: 'Roboto Mono', monospace;
            font-size: 72px;
            font-weight: 700;
            color: rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
            text-align: center;
        }

        /* コントロール部（下部） */
        .controls-section {
            position: relative;
            margin-top: 60px;
            display: flex;
            gap: 24px;
            flex-direction: column;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
        }

        .input-section {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        input {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            width: 50px;
            padding: 6px 8px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 0.6);
            color: rgba(0, 0, 0, 0.7);
            text-align: center;
            border-radius: 2px;
        }

        input:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.3);
        }

        .buttons-row {
            display: flex;
            gap: 16px;
        }

        button {
            font-family: 'Noto Serif JP', serif;
            font-size: 13px;
            padding: 8px 24px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 0.5);
            color: rgba(0, 0, 0, 0.65);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            min-width: 80px;
        }

        button:hover {
            background-color: rgba(255, 255, 255, 0.7);
            color: rgba(0, 0, 0, 0.85);
        }

        button:active {
            background-color: rgba(255, 255, 255, 0.6);
        }

        .hidden {
            display: none !important;
        }

        /* フラッシュエフェクト */
        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0);
            pointer-events: none;
            z-index: 1000;
        }

        /* キーボードヒント */
        .keyboard-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Roboto Mono', monospace;
            font-size: 9px;
            color: rgba(0, 0, 0, 0.12);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: none;
        }

        .keyboard-hint.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 墨の円セクション -->
        <div class="enso-circle">
            <!-- 墨の背景 -->
            <div class="enso-image"></div>
            
            <!-- フェードレイヤー -->
            <div class="enso-fade" id="ensoFade"></div>
            
            <!-- テキスト -->
            <div class="text-layer">
                <div class="label">Single-Tasking</div>
                <div class="timer-display" id="timerDisplay">05:00</div>
            </div>
        </div>

        <!-- コントロールセクション -->
        <div class="controls-section">
            <!-- 入力フォーム（最初は隠れている） -->
            <div class="input-section" id="inputSection" style="display: none;">
                <input type="number" id="minutes" min="0" max="99" value="5" placeholder="MM">
                <span style="color: rgba(0,0,0,0.3);">:</span>
                <input type="number" id="seconds" min="0" max="59" value="0" placeholder="SS">
                <button id="setBtn">設定</button>
            </div>

            <!-- ボタン -->
            <div class="buttons-row">
                <button id="startBtn">Start</button>
                <button id="pauseBtn" class="hidden">Pause</button>
                <button id="resetBtn">Reset</button>
            </div>
        </div>
    </div>

    <!-- フラッシュエフェクト -->
    <div class="flash" id="flashEffect"></div>

    <!-- キーボードヒント -->
    <div class="keyboard-hint" id="keyboardHint">SPACE・R・S</div>

    <script>
        let timeLeft = 300;
        let totalTime = 300;
        let isRunning = false;
        let timerInterval = null;

        const timerDisplay = document.getElementById('timerDisplay');
        const inputSection = document.getElementById('inputSection');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');
        const setBtn = document.getElementById('setBtn');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const ensoFade = document.getElementById('ensoFade');
        const flashEffect = document.getElementById('flashEffect');
        const keyboardHint = document.getElementById('keyboardHint');

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = 
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            
            // 進捗に応じた消失エフェクト
            const progress = 1 - (timeLeft / totalTime);
            const fadeOpacity = Math.min(progress * 1.3, 1);
            const noise = Math.random() * 0.02;
            ensoFade.style.backgroundColor = `rgba(241, 236, 228, ${fadeOpacity + noise})`;
        }

        function playFlash() {
            flashEffect.style.transition = 'none';
            flashEffect.style.backgroundColor = 'rgba(255, 255, 255, 1)';
            
            setTimeout(() => {
                flashEffect.style.transition = 'background-color 0.8s ease-out';
                flashEffect.style.backgroundColor = 'rgba(255, 255, 255, 0)';
            }, 50);
        }

        function playQuietSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioContext.sampleRate * 0.05;
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 0.007;
                }
                
                const source = audioContext.createBufferSource();
                const gainNode = audioContext.createGain();
                source.buffer = buffer;
                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                gainNode.gain.setValueAtTime(0.01, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.05);
                
                source.start(audioContext.currentTime);
            } catch (e) {
                // Silent
            }
        }

        startBtn.addEventListener('click', () => {
            if (timeLeft <= 0) return;
            isRunning = true;
            startBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            inputSection.style.display = 'none';
            keyboardHint.classList.add('visible');

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerInterval);
                    isRunning = false;
                    pauseBtn.classList.add('hidden');
                    startBtn.classList.remove('hidden');
                    keyboardHint.classList.remove('visible');
                    
                    playFlash();
                    playQuietSound();
                }
            }, 1000);
        });

        pauseBtn.addEventListener('click', () => {
            isRunning = false;
            clearInterval(timerInterval);
            pauseBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
            keyboardHint.classList.remove('visible');
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            isRunning = false;
            const mins = parseInt(minutesInput.value) || 0;
            const secs = parseInt(secondsInput.value) || 0;
            timeLeft = mins * 60 + secs;
            totalTime = timeLeft;
            updateDisplay();
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            keyboardHint.classList.remove('visible');
            ensoFade.style.backgroundColor = 'rgba(241, 236, 228, 0)';
        });

        setBtn.addEventListener('click', () => {
            const mins = parseInt(minutesInput.value) || 0;
            const secs = parseInt(secondsInput.value) || 0;
            timeLeft = mins * 60 + secs;
            totalTime = timeLeft;
            updateDisplay();
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            inputSection.style.display = 'none';
            keyboardHint.classList.remove('visible');
        });

        // キーボード
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) {
                    pauseBtn.click();
                } else if (timeLeft > 0) {
                    startBtn.click();
                }
            } else if (e.code === 'KeyR') {
                e.preventDefault();
                resetBtn.click();
            } else if (e.code === 'KeyS') {
                e.preventDefault();
                inputSection.style.display = 'flex';
                minutesInput.focus();
            }
        });

        updateDisplay();
    </script>
</body>
</html>
