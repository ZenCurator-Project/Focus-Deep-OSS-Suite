<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Clock | Focus-Deep</title>
    <link href="https://fonts.googleapis.com/css2?family=Extra+Light+200&family=Noto+Serif+JP:wght@200&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #F5F5F2; /* 少し灰みのある和紙の白 */
            --text-main: #1A1A1A;
            --enso-ink: rgba(26, 26, 26, 0.15); /* 墨の濃さ */
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-base);
            /* 強力な和紙テクスチャ演出：ノイズとグラデーション */
            background-image: 
                radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.03) 100%),
                url('https://www.transparenttextures.com/patterns/natural-paper.png'); /* 外部テクスチャで質感を担保 */
            color: var(--text-main);
            font-family: 'Noto Serif JP', serif;
            transition: background-color 3s ease;
            overflow: hidden;
        }

        /* 呼吸：背景の「光の奥行き」が動く */
        body.active {
            animation: meditative-glow 12s infinite ease-in-out;
        }

        @keyframes meditative-glow {
            0%, 100% { background-color: #F5F5F2; filter: contrast(100%); }
            50% { background-color: #EDECE8; filter: contrast(105%); }
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 400px;
            height: 400px;
        }

        /* 円相：墨の滲みを表現 */
        .enso-svg {
            position: absolute;
            width: 120%;
            height: 120%;
            transform: rotate(-90deg);
            filter: blur(1.5px); /* 墨の滲み */
        }

        .enso-ring {
            fill: none;
            stroke: var(--enso-ink);
            stroke-width: 4; /* 少し太くして存在感を出す */
            stroke-linecap: round;
            stroke-dasharray: 628;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 2s ease;
        }

        .active .enso-ring {
            stroke: rgba(26, 26, 26, 0.4); /* 集中中は墨が濃くなる */
        }

        .status-text {
            font-size: 0.8rem;
            letter-spacing: 0.6rem;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            z-index: 10;
        }

        .timer-display {
            font-family: 'Extra Light 200', sans-serif;
            font-size: 7rem;
            font-weight: 100;
            letter-spacing: -2px;
            margin: 0;
            z-index: 10;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 2rem;
            z-index: 10;
        }

        .controls button {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 0.75rem;
            cursor: pointer;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            opacity: 0.3;
            padding: 10px;
            transition: all 0.5s;
        }

        .controls button:hover {
            opacity: 1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body id="body">

<div class="container">
    <svg class="enso-svg" viewBox="0 0 220 220">
        <circle class="enso-ring" id="enso" cx="110" cy="110" r="100"></circle>
    </svg>

    <div class="status-text" id="status">Single-tasking</div>
    <div id="display" class="timer-display">25:00</div>
    <div class="controls">
        <button id="startBtn">Start</button>
        <button id="resetBtn">Reset</button>
    </div>
</div>

<script>
    let initialTime = 25 * 60;
    let timeLeft = initialTime;
    let timerId = null;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const body = document.getElementById('body');
    const statusText = document.getElementById('status');
    const enso = document.getElementById('enso');

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        // 円相（墨の輪）が消えていく演出
        const progress = timeLeft / initialTime;
        const offset = 628 * (1 - progress); 
        enso.style.strokeDashoffset = offset;
        
        document.title = `${display.textContent} | Zen-Clock`;
    }

    startBtn.addEventListener('click', () => {
        if (timerId === null) {
            body.classList.add('active');
            statusText.textContent = "Ichigyo Zanmai";
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    body.classList.remove('active');
                    statusText.textContent = "Finished";
                }
            }, 1000);
            startBtn.textContent = 'Pause';
        } else {
            clearInterval(timerId);
            timerId = null;
            body.classList.remove('active');
            startBtn.textContent = 'Resume';
            statusText.textContent = "Paused";
        }
    });

    resetBtn.addEventListener('click', () => {
        clearInterval(timerId);
        timerId = null;
        timeLeft = initialTime;
        updateDisplay();
        body.classList.remove('active');
        startBtn.textContent = 'Start';
        statusText.textContent = "Single-tasking";
    });

    updateDisplay();
</script>

</body>
</html>
