
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Clock | Focus-Deep</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Noto+Serif+JP:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #F0EDE8;
            --text-main: #1A1A1A;
            --light-shadow: rgba(0,0,0,0.05);
            --dark-shadow: rgba(0,0,0,0.15);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at center, transparent 0%, var(--light-shadow) 90%);
            background-size: cover;
            color: var(--text-main);
            font-family: 'Noto Serif JP', serif;
            overflow: hidden;
        }

        body.active {
            animation: meditative-glow 12s infinite ease-in-out;
        }

        @keyframes meditative-glow {
            0%, 100% { background-color: #F0EDE8; }
            50% { background-color: #E8E6E0; }
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 380px;
            height: 380px;
            margin-bottom: 60px;
        }

        .enso-ink {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.8;
            transition: opacity 1s ease-out;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.05));
        }

        body.active .enso-ink {
            opacity: 1;
        }

        .enso-mask-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .enso-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            transform-origin: center center;
            transform: rotateZ(-90deg) scaleY(0);
        }

        body.active .enso-mask {
            transform: rotateZ(-90deg) scaleY(1);
        }

        .status-text {
            font-family: 'Noto Serif JP', serif;
            font-size: 0.8rem;
            letter-spacing: 0.6rem;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            z-index: 10;
        }

        .timer-display {
            font-family: 'Roboto Mono', monospace;
            font-size: 7rem;
            font-weight: 300;
            letter-spacing: -2px;
            margin: 0;
            z-index: 10;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 2rem;
            z-index: 10;
        }

        .controls button {
            background: none;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            color: var(--text-main);
            font-family: 'Noto Serif JP', serif;
            font-size: 0.75rem;
            cursor: pointer;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
            padding: 0.6rem 1.5rem;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .controls button:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.03);
            transform: translateY(-1px);
        }

        .input-section {
            display: none;
            gap: 12px;
            margin-bottom: 20px;
            z-index: 10;
            align-items: center;
        }

        .input-section.visible {
            display: flex;
        }

        input {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            width: 50px;
            padding: 6px 8px;
            border: 1px solid rgba(0,0,0,0.2);
            background-color: rgba(255,255,255,0.6);
            color: rgba(0,0,0,0.7);
            text-align: center;
            border-radius: 2px;
        }

        input:focus {
            outline: none;
            background-color: rgba(255,255,255,0.8);
            border-color: rgba(0,0,0,0.3);
        }

        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255,255,255,0);
            pointer-events: none;
            z-index: 1000;
        }

        .keyboard-hint {
            position: fixed;
            bottom: 20px;
            font-family: 'Roboto Mono', monospace;
            font-size: 9px;
            color: rgba(0,0,0,0.12);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: none;
        }

        .keyboard-hint.visible {
            display: block;
        }
    </style>
</head>
<body id="body">

<div class="container">
    <img src="enso-ink.png" alt="Zen Enso Ink Circle" class="enso-ink" id="ensoInk">
    
    <div class="enso-mask-container">
        <div class="enso-mask" id="ensoMask"></div>
    </div>

    <div class="status-text" id="status">Single-tasking</div>
    <div id="display" class="timer-display">25:00</div>
</div>

<div class="input-section" id="inputSection">
    <input type="number" id="minutes" min="0" max="99" value="25" placeholder="MM">
    <span style="color: rgba(0,0,0,0.3);">:</span>
    <input type="number" id="seconds" min="0" max="59" value="0" placeholder="SS">
    <button id="setBtn">Set</button>
</div>

<div class="controls">
    <button id="startBtn">Start</button>
    <button id="pauseBtn" style="display: none;">Pause</button>
    <button id="resetBtn">Reset</button>
</div>

<div class="keyboard-hint" id="keyboardHint">SPACE・R・S</div>
<div class="flash" id="flashEffect"></div>

<script>
    let initialTime = 25 * 60;
    let timeLeft = initialTime;
    let timerId = null;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const setBtn = document.getElementById('setBtn');
    const body = document.getElementById('body');
    const statusText = document.getElementById('status');
    const ensoMask = document.getElementById('ensoMask');
    const inputSection = document.getElementById('inputSection');
    const minutesInput = document.getElementById('minutes');
    const secondsInput = document.getElementById('seconds');
    const keyboardHint = document.getElementById('keyboardHint');
    const flashEffect = document.getElementById('flashEffect');

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        const progress = timeLeft / initialTime;
        ensoMask.style.transform = `rotateZ(${(-90 + (1 - progress) * 360)}deg) scaleY(1)`;
        
        document.title = `${display.textContent} | Zen-Clock`;
    }

    function playFlash() {
        flashEffect.style.transition = 'none';
        flashEffect.style.backgroundColor = 'rgba(255, 255, 255, 1)';
        
        setTimeout(() => {
            flashEffect.style.transition = 'background-color 0.8s ease-out';
            flashEffect.style.backgroundColor = 'rgba(255, 255, 255, 0)';
        }, 50);
    }

    function playQuietSound() {
        try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = audioContext.sampleRate * 0.05;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 0.007;
            }
            
            const source = audioContext.createBufferSource();
            const gainNode = audioContext.createGain();
            source.buffer = buffer;
            source.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            gainNode.gain.setValueAtTime(0.01, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.05);
            
            source.start(audioContext.currentTime);
        } catch (e) {
            // Silent
        }
    }

    startBtn.addEventListener('click', () => {
        if (timerId === null) {
            body.classList.add('active');
            statusText.textContent = "Ichigyo Zanmai";
            inputSection.classList.remove('visible');
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'block';
            keyboardHint.classList.add('visible');
            
            ensoMask.style.transition = 'transform 0s';
            ensoMask.style.transform = `rotateZ(-90deg) scaleY(1)`;
            
            setTimeout(() => {
                ensoMask.style.transition = `transform ${initialTime}s linear`;
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timerId = null;
                        body.classList.remove('active');
                        statusText.textContent = "Finished";
                        pauseBtn.style.display = 'none';
                        startBtn.style.display = 'block';
                        keyboardHint.classList.remove('visible');
                        playFlash();
                        playQuietSound();
                    }
                }, 1000);
            }, 50);
        }
    });

    pauseBtn.addEventListener('click', () => {
        clearInterval(timerId);
        timerId = null;
        body.classList.remove('active');
        pauseBtn.style.display = 'none';
        startBtn.style.display = 'block';
        statusText.textContent = "Paused";
        keyboardHint.classList.remove('visible');
        startBtn.textContent = 'Resume';
    });

    resetBtn.addEventListener('click', () => {
        clearInterval(timerId);
        timerId = null;
        timeLeft = initialTime;
        updateDisplay();
        body.classList.remove('active');
        pauseBtn.style.display = 'none';
        startBtn.style.display = 'block';
        startBtn.textContent = 'Start';
        statusText.textContent = "Single-tasking";
        inputSection.classList.remove('visible');
        keyboardHint.classList.remove('visible');
        ensoMask.style.transition = 'transform 0.5s ease-out';
        ensoMask.style.transform = `rotateZ(-90deg) scaleY(1)`;
    });

    setBtn.addEventListener('click', () => {
        const mins = parseInt(minutesInput.value) || 25;
        const secs = parseInt(secondsInput.value) || 0;
        initialTime = mins * 60 + secs;
        timeLeft = initialTime;
        updateDisplay();
        inputSection.classList.remove('visible');
    });

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (timerId !== null) {
                pauseBtn.click();
            } else {
                startBtn.click();
            }
        } else if (e.code === 'KeyR') {
            e.preventDefault();
            resetBtn.click();
        } else if (e.code === 'KeyS') {
            e.preventDefault();
            inputSection.classList.toggle('visible');
            if (inputSection.classList.contains('visible')) {
                minutesInput.focus();
            }
        }
    });

    updateDisplay();
</script>

</body>
</html>
