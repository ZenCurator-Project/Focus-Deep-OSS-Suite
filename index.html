<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Clock | Deep Focus</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Noto+Serif+JP:wght@300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #F5F3F0;
            font-family: 'Noto Serif JP', sans-serif;
            color: #1A1A1A;
            overflow: hidden;
        }

        /* 上部ラベル */
        .label-top {
            position: absolute;
            top: 60px;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(0, 0, 0, 0.25);
            text-transform: uppercase;
        }

        /* メインコンテナ */
        .main-display {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 420px;
            height: 420px;
            margin-bottom: 80px;
        }

        /* 墨の円 */
        .enso-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .enso-image {
            position: absolute;
            width: 360px;
            height: 360px;
            background-image: url('enso-ink.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.85;
            transition: opacity 0.5s ease;
        }

        /* 消失マスク */
        .enso-fade {
            position: absolute;
            width: 360px;
            height: 360px;
            background: #F5F3F0;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* 中央テキスト */
        .timer-text {
            position: absolute;
            z-index: 10;
            text-align: center;
        }

        .timer-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .timer-display {
            font-family: 'Roboto Mono', monospace;
            font-size: 72px;
            font-weight: 300;
            letter-spacing: -2px;
            color: rgba(0, 0, 0, 0.4);
            font-variant-numeric: tabular-nums;
        }

        /* 下部コントロール */
        .controls-wrapper {
            position: absolute;
            bottom: -80px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .input-group {
            display: none;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .input-group.visible {
            display: flex;
        }

        input {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            width: 50px;
            padding: 6px 8px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background-color: rgba(255, 255, 255, 0.6);
            color: rgba(0, 0, 0, 0.7);
            text-align: center;
            border-radius: 3px;
        }

        input:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.25);
        }

        .button-group {
            display: flex;
            gap: 16px;
        }

        button {
            font-family: 'Noto Serif JP', serif;
            font-size: 13px;
            padding: 8px 24px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background-color: rgba(255, 255, 255, 0.5);
            color: rgba(0, 0, 0, 0.65);
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        button:hover {
            background-color: rgba(255, 255, 255, 0.7);
            color: rgba(0, 0, 0, 0.85);
        }

        button:active {
            background-color: rgba(255, 255, 255, 0.6);
        }

        /* フラッシュエフェクト */
        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0);
            pointer-events: none;
            z-index: 1000;
        }

        /* キーボードヒント */
        .keyboard-hint {
            position: fixed;
            bottom: 20px;
            font-family: 'Roboto Mono', monospace;
            font-size: 9px;
            color: rgba(0, 0, 0, 0.1);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: none;
        }

        .keyboard-hint.visible {
            display: block;
        }
    </style>
</head>
<body>

    <div class="label-top">Single-Tasking</div>

    <div class="main-display">
        <div class="enso-wrapper">
            <div class="enso-image" id="ensoImage" style="background-image: url('enso-circle.png');"></div>
            <div class="enso-fade" id="ensoFade"></div>
            
            <div class="timer-text">
                <div class="timer-label" id="timerLabel">05:00</div>
                <div class="timer-display" id="timerDisplay">05:00</div>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="input-group" id="inputGroup">
                <input type="number" id="minutes" min="0" max="99" value="5" placeholder="MM">
                <span style="color: rgba(0,0,0,0.3); font-size: 13px;">:</span>
                <input type="number" id="seconds" min="0" max="59" value="0" placeholder="SS">
                <button id="setBtn">Set</button>
            </div>

            <div class="button-group">
                <button id="startBtn">Start</button>
                <button id="pauseBtn" style="display: none;">Pause</button>
                <button id="resetBtn">Reset</button>
            </div>
        </div>
    </div>

    <div class="flash" id="flashEffect"></div>
    <div class="keyboard-hint" id="keyboardHint">SPACE・R・S</div>

    <script>
        let totalTime = 5 * 60;
        let timeLeft = totalTime;
        let timerId = null;
        let isRunning = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const timerLabel = document.getElementById('timerLabel');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const setBtn = document.getElementById('setBtn');
        const inputGroup = document.getElementById('inputGroup');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');
        const ensoFade = document.getElementById('ensoFade');
        const ensoImage = document.getElementById('ensoImage');
        ensoImage.style.backgroundImage = `url('enso-ink.png?t=${Date.now()}')`;
        const flashEffect = document.getElementById('flashEffect');
        const keyboardHint = document.getElementById('keyboardHint');

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            timerDisplay.textContent = timeStr;
            timerLabel.textContent = timeStr;
            
            // 進捗に応じた消失エフェクト
            const progress = (totalTime - timeLeft) / totalTime;
            ensoFade.style.opacity = Math.min(progress * 1.3, 1);
            
            document.title = `${timeStr} | Zen-Clock`;
        }

        function playFlash() {
            flashEffect.style.transition = 'none';
            flashEffect.style.backgroundColor = 'rgba(255, 255, 255, 1)';
            
            setTimeout(() => {
                flashEffect.style.transition = 'background-color 0.8s ease-out';
                flashEffect.style.backgroundColor = 'rgba(255, 255, 255, 0)';
            }, 50);
        }

        function playQuietSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioContext.sampleRate * 0.05;
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 0.006;
                }
                
                const source = audioContext.createBufferSource();
                const gainNode = audioContext.createGain();
                source.buffer = buffer;
                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                gainNode.gain.setValueAtTime(0.008, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.05);
                
                source.start(audioContext.currentTime);
            } catch (e) {
                // Silent
            }
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                startBtn.style.display = 'none';
                pauseBtn.style.display = 'block';
                inputGroup.classList.remove('visible');
                keyboardHint.classList.add('visible');
                
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        isRunning = false;
                        pauseBtn.style.display = 'none';
                        startBtn.style.display = 'block';
                        keyboardHint.classList.remove('visible');
                        playFlash();
                        playQuietSound();
                    }
                }, 1000);
            }
        });

        pauseBtn.addEventListener('click', () => {
            clearInterval(timerId);
            isRunning = false;
            pauseBtn.style.display = 'none';
            startBtn.style.display = 'block';
            keyboardHint.classList.remove('visible');
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(timerId);
            isRunning = false;
            timeLeft = totalTime;
            updateDisplay();
            pauseBtn.style.display = 'none';
            startBtn.style.display = 'block';
            inputGroup.classList.remove('visible');
            keyboardHint.classList.remove('visible');
            ensoFade.style.opacity = 0;
        });

        setBtn.addEventListener('click', () => {
            const mins = parseInt(minutesInput.value) || 5;
            const secs = parseInt(secondsInput.value) || 0;
            totalTime = mins * 60 + secs;
            timeLeft = totalTime;
            updateDisplay();
            inputGroup.classList.remove('visible');
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) {
                    pauseBtn.click();
                } else if (timeLeft > 0) {
                    startBtn.click();
                }
            } else if (e.code === 'KeyR') {
                e.preventDefault();
                resetBtn.click();
            } else if (e.code === 'KeyS') {
                e.preventDefault();
                inputGroup.classList.toggle('visible');
                if (inputGroup.classList.contains('visible')) {
                    minutesInput.focus();
                }
            }
        });

        updateDisplay();
    </script>

</body>
</html>
