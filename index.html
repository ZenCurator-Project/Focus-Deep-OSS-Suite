<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Clock | Focus-Deep</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Noto+Serif+JP:wght@200&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F1ECE4;
            /* 和紙のテクスチャURLを共通化 */
            --washi-url: url('https://www.transparenttextures.com/patterns/cream-paper.png');
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            background-image: var(--washi-url);
            font-family: 'Noto Serif JP', serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 400px;
            height: 400px;
        }

        /* 墨の画像：プロデューサーの画像を切り抜いて表示 */
        .enso-ink-image {
            position: absolute;
            width: 100%;
            height: 100%;
            /* お持ちの画像を読み込み */
            background-image: url('enso-ink.jpg');
            /* 画像の左上から1つ目の円だけを切り抜く設定 */
            background-size: 400% 500%; 
            background-position: 0 0;
            background-repeat: no-repeat;
            z-index: 1;
            /* 白背景を透明化（乗算） */
            mix-blend-mode: multiply; 
            opacity: 0.8;
        }

        /* 墨を隠すためのマスク：背景と全く同じデザインにする */
        .enso-mask {
            position: absolute;
            width: 105%; /* わずかに大きくして端まで隠す */
            height: 105%;
            z-index: 5;
            pointer-events: none;
            /* 背景と全く同じ色とテクスチャを扇形に適用 */
            background: conic-gradient(transparent 0deg, var(--bg-color) 0deg);
            background-blend-mode: normal;
            transform: rotate(-90deg);
        }

        /* 境界線を消すための和紙テクスチャの重ねがけ */
        .enso-mask::after {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background-image: var(--washi-url);
            opacity: 0.5;
        }

        .content-layer {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .status-text {
            font-size: 0.8rem;
            letter-spacing: 0.5rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .timer-display {
            font-family: 'Roboto Mono', monospace;
            font-size: 7rem;
            font-weight: 300;
            letter-spacing: -4px;
            margin: 0;
        }

        .controls button {
            background: none;
            border: 1px solid rgba(0,0,0,0.1);
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="enso-ink-image"></div>
    <div class="enso-mask" id="ensoMask"></div>

    <div class="content-layer">
        <div id="status" class="status-text">Single-tasking</div>
        <div id="display" class="timer-display">25:00</div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>
</div>

<script>
    let initialTime = 25 * 60;
    let timeLeft = initialTime;
    let timerId = null;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const ensoMask = document.getElementById('ensoMask');

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        const progress = 1 - (timeLeft / initialTime);
        const degrees = progress * 360;
        // マスク自体に背景テクスチャを混ぜることで、四角い箱を消去
        ensoMask.style.background = `conic-gradient(transparent 0deg, #F1ECE4 ${degrees}deg)`;
    }

    startBtn.addEventListener('click', () => {
        if (timerId === null) {
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                }
            }, 1000);
            startBtn.textContent = 'Pause';
        } else {
            clearInterval(timerId);
            timerId = null;
            startBtn.textContent = 'Resume';
        }
    });

    resetBtn.addEventListener('click', () => {
        clearInterval(timerId);
        timerId = null;
        timeLeft = initialTime;
        updateDisplay();
        startBtn.textContent = 'Start';
    });

    updateDisplay();
</script>
</body>
</html>
