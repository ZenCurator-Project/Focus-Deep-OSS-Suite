<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Clock | Focus-Deep</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Noto+Serif+JP:wght@200&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #F0EDE8; /* 和紙のベースカラー */
            --text-main: #1A1A1A;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-base);
            /* 和紙の質感を背景として指定 */
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            font-family: 'Noto Serif JP', serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 450px;
            height: 450px;
        }

        /* 1. 墨の画像レイヤー（アップロードした enso-ink.png を表示） */
        .enso-ink-image {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('enso-ink.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 1;
            opacity: 0.8;
        }

        /* 2. 墨を隠していくためのマスク（蓋）レイヤー */
        .enso-mask-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            transform: rotate(-90deg); /* 12時の位置から開始 */
            pointer-events: none;
        }

        .enso-mask {
            position: absolute;
            width: 100%;
            height: 100%;
            /* 背景と同じ色で塗りつぶした扇形の蓋（これで墨を隠します） */
            background: conic-gradient(transparent 0deg, var(--bg-base) 0deg);
            transform-origin: center;
            transition: background 1s linear;
        }

        /* 3. タイマー表示レイヤー */
        .content-layer {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .status-text {
            font-size: 0.9rem;
            letter-spacing: 0.6rem;
            color: #666;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .timer-display {
            font-family: 'Roboto Mono', monospace;
            font-size: 7.5rem;
            font-weight: 300;
            letter-spacing: -4px;
            margin: 0;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .controls button {
            background: none;
            border: 1px solid rgba(0,0,0,0.1);
            color: var(--text-main);
            padding: 0.5rem 1.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            transition: all 0.3s;
        }

        .controls button:hover {
            background-color: rgba(0,0,0,0.03);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="enso-ink-image"></div>
    
    <div class="enso-mask-container">
        <div class="enso-mask" id="ensoMask"></div>
    </div>

    <div class="content-layer">
        <div class="status-text" id="status">Single-tasking</div>
        <div id="display" class="timer-display">25:00</div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>
</div>

<script>
    let initialTime = 25 * 60;
    let timeLeft = initialTime;
    let timerId = null;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const ensoMask = document.getElementById('ensoMask');

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        // 残り時間に合わせて「蓋（マスク）」を広げ、墨を隠していく
        const progress = 1 - (timeLeft / initialTime);
        const degrees = progress * 360;
        // 背景色（#F0EDE8）の扇形を広げていく
        ensoMask.style.background = `conic-gradient(transparent 0deg, #F0EDE8 ${degrees}deg)`;
        
        document.title = `${display.textContent} | Zen-Clock`;
    }

    startBtn.addEventListener('click', () => {
        if (timerId === null) {
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    alert("Focus session complete.");
                }
            }, 1000);
            startBtn.textContent = 'Pause';
        } else {
            clearInterval(timerId);
            timerId = null;
            startBtn.textContent = 'Resume';
        }
    });

    resetBtn.addEventListener('click', () => {
        clearInterval(timerId);
        timerId = null;
        timeLeft = initialTime;
        updateDisplay();
        startBtn.textContent = 'Start';
    });

    // 初期化
    updateDisplay();
</script>
</body>
</html>
