<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Clock | Deep Focus Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F1ECE4;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            background-size: 512px 512px;
            font-family: 'Noto Serif JP', serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 背景テクスチャレイヤー */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #F1ECE4;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            background-size: 512px 512px;
            z-index: 0;
        }

        /* ラベル */
        .label {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(0, 0, 0, 0.25);
            text-transform: uppercase;
            z-index: 5;
        }

        /* 墨の円レイヤー */
        .enso-layer {
            position: absolute;
            width: 400px;
            height: 400px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .enso-image {
            width: 100%;
            height: 100%;
            background-image: url('enso-ink.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            mix-blend-mode: multiply;
            -webkit-mask-image: radial-gradient(circle, transparent 0%, transparent 48%, black 50%, black 100%);
            mask-image: radial-gradient(circle, transparent 0%, transparent 48%, black 50%, black 100%);
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* フェードレイヤー（粒子的消失用） */
        .enso-fade {
            position: absolute;
            width: 400px;
            height: 400px;
            z-index: 3;
            -webkit-mask-image: radial-gradient(circle, transparent 0%, transparent 48%, black 50%, black 100%);
            mask-image: radial-gradient(circle, transparent 0%, transparent 48%, black 50%, black 100%);
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
        }

        /* フラッシュエフェクト */
        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0);
            pointer-events: none;
            z-index: 10;
        }

        /* UIコンテナ */
        .ui-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 4;
            pointer-events: none;
        }

        /* タイマー数字 */
        .timer-display {
            font-family: 'Roboto Mono', monospace;
            font-size: 64px;
            font-weight: 700;
            color: rgba(0, 0, 0, 0.25);
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
            pointer-events: auto;
            transition: font-size 0.3s ease;
        }

        /* キーボードヒント */
        .keyboard-hint {
            position: absolute;
            bottom: 30px;
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            color: rgba(0, 0, 0, 0.15);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none;
        }

        .keyboard-hint.visible {
            display: block;
        }

        /* コントロール */
        .controls {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        button {
            font-family: 'Noto Serif JP', serif;
            font-size: 13px;
            padding: 8px 16px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background-color: rgba(255, 255, 255, 0.4);
            color: rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 2px;
            pointer-events: auto;
        }

        button:hover {
            background-color: rgba(255, 255, 255, 0.6);
            color: rgba(0, 0, 0, 0.8);
        }

        button:active {
            background-color: rgba(255, 255, 255, 0.5);
        }

        /* 入力フィールド */
        .input-section {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            pointer-events: auto;
        }

        input {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            width: 60px;
            padding: 6px 8px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background-color: rgba(255, 255, 255, 0.5);
            color: rgba(0, 0, 0, 0.7);
            text-align: center;
            border-radius: 2px;
        }

        input:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.3);
        }

        /* 非表示 */
        .hidden {
            display: none;
        }

        /* フォーカス時のキーボードヒント表示 */
        .running .keyboard-hint {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 背景レイヤー -->
        <div class="background"></div>

        <!-- ラベル -->
        <div class="label">SINGLE-TASKING</div>

        <!-- 墨の円レイヤー -->
        <div class="enso-layer">
            <div class="enso-image"></div>
        </div>

        <!-- フェードアウトレイヤー -->
        <div class="enso-fade" id="ensoFade"></div>

        <!-- フラッシュエフェクト -->
        <div class="flash" id="flashEffect"></div>

        <!-- UI -->
        <div class="ui-container">
            <div class="timer-display" id="timerDisplay">00:00</div>
            <div class="input-section" id="inputSection">
                <input type="number" id="minutes" min="0" max="99" value="5" placeholder="MM">
                <span style="color: rgba(0,0,0,0.3); font-size: 14px; display: flex; align-items: center;">:</span>
                <input type="number" id="seconds" min="0" max="59" value="0" placeholder="SS">
                <button id="setBtn">設定</button>
            </div>
            <div class="controls">
                <button id="startBtn">開始</button>
                <button id="pauseBtn" class="hidden">一時停止</button>
                <button id="resetBtn">リセット</button>
            </div>
            <div class="keyboard-hint" id="keyboardHint">SPACE: 再開/一時停止 · R: リセット</div>
        </div>
    </div>

    <script>
        let timeLeft = 300;
        let totalTime = 300;
        let isRunning = false;
        let timerInterval = null;

        const timerDisplay = document.getElementById('timerDisplay');
        const inputSection = document.getElementById('inputSection');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');
        const setBtn = document.getElementById('setBtn');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const ensoFade = document.getElementById('ensoFade');
        const flashEffect = document.getElementById('flashEffect');
        const keyboardHint = document.getElementById('keyboardHint');
        const container = document.querySelector('.container');

        // フォーマット表示
        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = 
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            
            // 進捗に応じた粒子的消失エフェクト
            const progress = 1 - (timeLeft / totalTime);
            const fadeOpacity = Math.min(progress * 1.2, 1);
            
            // ノイズパターンを追加して粒子感を演出
            const noiseIntensity = Math.random() * 0.05;
            ensoFade.style.backgroundColor = `rgba(241, 236, 228, ${fadeOpacity + noiseIntensity})`;
            ensoFade.style.filter = `url(#noiseFilter)`;
        }

        // 白フラッシュエフェクト
        function playFlash() {
            flashEffect.style.transition = 'none';
            flashEffect.style.backgroundColor = 'rgba(255, 255, 255, 1)';
            
            setTimeout(() => {
                flashEffect.style.transition = 'background-color 0.8s ease-out';
                flashEffect.style.backgroundColor = 'rgba(255, 255, 255, 0)';
            }, 50);
        }

        // 極めて静かなホワイトノイズ
        function playQuietSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioContext.sampleRate * 0.05; // 50ms
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                
                // ホワイトノイズ生成
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 0.01; // 極めて小さな音量
                }
                
                const source = audioContext.createBufferSource();
                const gainNode = audioContext.createGain();
                source.buffer = buffer;
                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                gainNode.gain.setValueAtTime(0.02, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.05);
                
                source.start(audioContext.currentTime);
            } catch (e) {
                // オーディオコンテキスト利用不可の場合は無音
            }
        }

        // 設定
        setBtn.addEventListener('click', () => {
            const mins = parseInt(minutesInput.value) || 0;
            const secs = parseInt(secondsInput.value) || 0;
            timeLeft = mins * 60 + secs;
            totalTime = timeLeft;
            updateDisplay();
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            container.classList.remove('running');
        });

        // 開始
        startBtn.addEventListener('click', () => {
            if (timeLeft <= 0) return;
            isRunning = true;
            startBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            inputSection.classList.add('hidden');
            container.classList.add('running');

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerInterval);
                    isRunning = false;
                    pauseBtn.classList.add('hidden');
                    startBtn.classList.remove('hidden');
                    inputSection.classList.remove('hidden');
                    container.classList.remove('running');
                    
                    // 完了エフェクト
                    playFlash();
                    playQuietSound();
                }
            }, 1000);
        });

        // 一時停止
        pauseBtn.addEventListener('click', () => {
            isRunning = false;
            clearInterval(timerInterval);
            pauseBtn.classList.add('hidden');
            startBtn.classList.remove('hidden');
            container.classList.remove('running');
        });

        // リセット
        resetBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            isRunning = false;
            const mins = parseInt(minutesInput.value) || 0;
            const secs = parseInt(secondsInput.value) || 0;
            timeLeft = mins * 60 + secs;
            totalTime = timeLeft;
            updateDisplay();
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            inputSection.classList.remove('hidden');
            ensoFade.style.backgroundColor = 'rgba(241, 236, 228, 0)';
            container.classList.remove('running');
        });

        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) {
                    pauseBtn.click();
                } else if (timeLeft > 0) {
                    startBtn.click();
                }
            } else if (e.code === 'KeyR') {
                e.preventDefault();
                resetBtn.click();
            } else if (e.code === 'KeyS') {
                e.preventDefault();
                minutesInput.focus();
            }
        });

        // 初期表示
        updateDisplay();
    </script>
</body>
</html>
